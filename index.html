<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Baby Schedule Tracker</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <h1>🌱 Baby Schedule</h1>
    <div class="account-area">
      <span id="account-label" class="muted"></span>
      <button id="sign-in-btn" class="btn-secondary" style="display:none">Sign in with Microsoft</button>
    </div>
  </div>

  <div class="header-controls">
    <div class="date-control">
      <label for="date-input" class="visually-hidden">Date</label>
      <input type="date" id="date-input" />
    </div>
    <button id="save-btn" class="btn-primary">Save</button>
  </div>

  <div class="layout-controls">
    <button id="add-layout-btn" class="icon-btn" title="Create new layout">
      <span class="plus-circle">&#10133;</span>
    </button>
    <select id="layout-select" aria-label="Schedule layout"></select>
  </div>
</header>

<main class="blocks-container">
  <div id="summary-container"></div>
  <div id="blocks-container" class="blocks-list"></div>
</main>

<div id="toast" class="toast"></div>

<!-- Third-party libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/@azure/msal-browser@v5.x/lib/msal-browser.min.js"></script>

<!-- App config -->
<script src="js/config.js"></script>

<!-- Core utilities -->
<script src="js/csv.js"></script>
<script src="js/storage/localStore.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage/oneDriveStore.js"></script>
<script src="js/dataStore.js"></script>

<!-- Block system -->
<script src="js/blocks/base.js"></script>
<script src="js/blocks/fieldWidgets.js"></script>
<script src="js/blocks/questionnaireCounter.js"></script>
<script src="js/blocks/sleep.js"></script>
<script src="js/blocks/bottle.js"></script>
<script src="js/blocks/meal.js"></script>
<script src="js/blocks/diary.js"></script>
<script src="js/blocks/index.js"></script>

<!-- UI -->
<script src="js/layoutEditor.js"></script>
<script src="js/summary.js"></script>
<script src="js/app.js"></script>

</body>
</html>
